services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: leisure-qdrant
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC (Spring AI qdrant starter 기본값)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: leisure-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    # GPU로 돌리려면 아래 주석 해제 (NVIDIA Container Toolkit 설치 필요)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ollama.com 레지스트리에 없는 커스텀 GGUF라 pull이 아니라 create로 등록해야 함.
  # models/ollama/ 에 Modelfile + <모델명>.gguf 를 같이 넣어두면 이 컨테이너가 읽어서 등록하고 종료됨.
  ollama-create:
    image: ollama/ollama:latest
    container_name: leisure-ollama-create
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./models/ollama:/models:ro
    entrypoint: ["sh", "-c", "OLLAMA_HOST=ollama:11434 ollama create ${OLLAMA_MODEL:-kanana} -f /models/Modelfile"]
    restart: "no"

volumes:
  qdrant_storage:
  ollama_data:
