plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.leisure'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', '2.0.1')
	set('onnxRuntimeVersion', '1.19.2')
	set('djlTokenizersVersion', '0.31.1')
}

dependencies {
	// spring actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// spring webflux
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// spring mvc
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// spring ai ollama
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

	// spring ai qdrant
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'

	// BGE-M3 / bge-reranker-v2-m3 ONNX 추론용 (Spring AI에 대응 추상화 없음)
	// onnxruntime
	implementation "com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}"

	// hugging face tokenizer
	implementation "ai.djl.huggingface:tokenizers:${djlTokenizersVersion}"

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// test
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	description = '단위 테스트'
	useJUnitPlatform {
		excludeTags 'integration'
	}
	testLogging {
		events "failed"
		exceptionFormat = "full"
		showStandardStreams = true
	}
}

tasks.register('integrationTest', Test) {
	description = '통합 테스트'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.named('test')
	testLogging {
		events "failed"
		exceptionFormat = "full"
		showStandardStreams = true
	}
}
